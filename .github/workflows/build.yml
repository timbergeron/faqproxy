name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: faqproxy-linux
          - name: macOS
            os: macos-latest
            artifact: faqproxy-macos

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and test
        run: make test CFLAGS="-O2 -g -Werror"

      - name: Show binary type
        run: file build/faqproxy

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/faqproxy
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            file
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python

      - name: Build and test
        run: make test CFLAGS="-O2 -g -Werror"

      - name: Show binary type
        run: file build/faqproxy.exe

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: faqproxy-windows-x86_64
          path: build/faqproxy.exe
          if-no-files-found: error
          retention-days: 14

  sanitize:
    name: Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run AddressSanitizer and UndefinedBehaviorSanitizer
        run: make sanitize

      - name: Validate systemd service
        run: |
          sudo install -m 0755 build/faqproxy /usr/local/bin/faqproxy
          systemd-analyze verify docs/faqproxy.service
